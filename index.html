
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>CARL - Personal AI</title>

<style>
* {
  box-sizing: border-box;
}

html {
  height: 100%;
}

body {
  margin: 0;
  background: #080d16;
  color: #eaf3ff;
  font-family: Arial, sans-serif;
  min-height: 100%;
}

header {
  padding: 22px;
  border-bottom: 1px solid #1b3550;
  display: flex;
  align-items: center;
  gap: 13px;
}

.logo {
  width: 43px;
  height: 43px;
  border: 2px solid #38bdf8;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: #38bdf8;
  font-size: 21px;
  box-shadow: 0 0 15px #087da866;
}

header h2 {
  margin: 0;
  letter-spacing: 4px;
}

header small {
  color: #38bdf8;
  font-size: 10px;
  letter-spacing: 2px;
}

.status {
  margin-left: auto;
  color: #4ade80;
  font-size: 11px;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 25px 17px calc(var(--composer-height, 100px) + 25px);
}

.welcome {
  text-align: center;
  margin: 65px 0 35px;
}

.core {
  width: 105px;
  height: 105px;
  margin: auto;
  border: 2px solid #38bdf8;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 43px;
  color: #38bdf8;
  box-shadow: 0 0 35px #0284c766,
              inset 0 0 25px #0284c733;
}

.welcome h1 {
  letter-spacing: 7px;
  margin-bottom: 8px;
}

.welcome p {
  color: #8198b1;
  font-size: 13px;
}

#chat {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.message {
  padding: 14px 16px;
  border-radius: 14px;
  max-width: 85%;
  line-height: 1.6;
  font-size: 14px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.bot {
  align-self: flex-start;
  background: #12243a;
  border: 1px solid #1c4668;
}

.user {
  align-self: flex-end;
  background: #075985;
}

.sender {
  color: #38bdf8;
  font-size: 10px;
  margin-bottom: 6px;
  letter-spacing: 1px;
}

.composer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 100;
  background: #080d16;
  padding: 12px 15px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  border-top: 1px solid #1b3550;
}

.input-area {
  max-width: 700px;
  margin: auto;
  display: flex;
  align-items: flex-end;
  gap: 9px;
<textarea
  id="message"
  rows="1"
  placeholder="Katakan sesuatu kepada CARL..."
  autocomplete="off"
  enterkeyhint="enter"
  inputmode="text"
></textarea>

button {
  flex-shrink: 0;
  width: 64px;
  height: 54px;
  background: #0284c7;
  border: none;
  border-radius: 12px;
  color: white;
  font-size: 23px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: wait;
}

footer {
  text-align: center;
  color: #52677e;
  font-size: 10px;
  margin-top: 25px;
}

</style>
</head>

<body>

<header>
  <div class="logo">C</div>
  <div>
    <h2>CARL</h2>
    <small>PERSONAL AI ASSISTANT</small>
  </div>
  <div class="status">● ONLINE</div>
</header>

<main>
  <section class="welcome" id="welcome">
    <div class="core">✧</div>
    <h1>HELLO, HUMAN.</h1>
    <p>CARL interface initialized.</p>
    <p>Personal AI system — Version 0.3</p>
  </section>

  <section id="chat">
    <div class="message bot">
      <div class="sender">CARL</div>
      Halo! Saya CARL, asisten pribadi Angga.
      Senang bisa kembali berbicara denganmu.
    </div>
  </section>

  <footer>CARL PROJECT © 2026</footer>
</main>

<div class="composer" id="composer">
  <div class="input-area">
    <textarea
      id="message"
      rows="1"
      placeholder="Katakan sesuatu kepada CARL..."
      autocomplete="off"
      enterkeyhint="enter"
    ></textarea>

    <button id="sendButton" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
const API_URL =
  "https://carl-api.ahmadanggaalhabsy-aaa.workers.dev/";

const input = document.getElementById("message");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");
const sendButton = document.getElementById("sendButton");
const composer = document.getElementById("composer");
const main = document.querySelector("main");

let conversationHistory = [];

// Menyesuaikan ruang bawah dengan tinggi kolom pesan
function updateComposerHeight() {
  const height = composer.offsetHeight;
  document.documentElement.style.setProperty(
    "--composer-height",
    height + "px"
  );
}

if ("ResizeObserver" in window) {
  const observer = new ResizeObserver(updateComposerHeight);
  observer.observe(composer);
}

window.addEventListener("resize", updateComposerHeight);
window.addEventListener("load", updateComposerHeight);

// Membuat textarea bertambah tinggi otomatis
function resizeInput() {
  input.style.height = "54px";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
  updateComposerHeight();
}

input.addEventListener("input", resizeInput);

// Mengarahkan tampilan ke pesan terbaru
function scrollToLatest() {
  requestAnimationFrame(() => {
    const lastMessage = chat.lastElementChild;

    if (lastMessage) {
      lastMessage.scrollIntoView({
        behavior: "smooth",
        block: "end"
      });
    }
  });
}

function addMessage(senderName, text, type) {
  const box = document.createElement("div");
  box.className = "message " + type;

  const sender = document.createElement("div");
  sender.className = "sender";
  sender.textContent = senderName;

  const content = document.createElement("div");
  content.textContent = text;

  box.appendChild(sender);
  box.appendChild(content);
  chat.appendChild(box);

  return content;
}

async function sendMessage() {
  const text = input.value.trim();

  if (!text || sendButton.disabled) return;

  welcome.style.display = "none";

  addMessage("ANGGA", text, "user");

  const reply = addMessage(
    "CARL",
    "Sedang memproses...",
    "bot"
  );

  input.value = "";
  resizeInput();

  sendButton.disabled = true;
  scrollToLatest();

  const pendingHistory = [
    ...conversationHistory,
    {
      role: "user",
      content: text
    }
  ].slice(-12);

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain"
      },
      body: JSON.stringify({
        messages: pendingHistory
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.details || data.error || "Koneksi gagal"
      );
    }

    const answer = data.reply || "CARL menerima pesan.";

    reply.textContent = answer;

    conversationHistory = [
      ...pendingHistory,
      {
        role: "assistant",
        content: answer
      }
    ].slice(-12);

  } catch (error) {
    reply.textContent = "Terjadi kesalahan: " + error.message;
  }

  sendButton.disabled = false;
  scrollToLatest();
}

// Enter membuat baris baru.
// Ctrl + Enter mengirim pesan.
input.addEventListener("keydown", function(event) {
  if (event.key === "Enter" && event.ctrlKey) {
    event.preventDefault();
    sendMessage();
  }
});

updateComposerHeight();
</script>

</body>
</html>
