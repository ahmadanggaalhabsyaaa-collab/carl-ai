
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARL - Personal AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #080d16;
  color: #eaf3ff;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

header {
  padding: 22px;
  border-bottom: 1px solid #1b3550;
  display: flex;
  align-items: center;
  gap: 13px;
}

.logo {
  width: 43px;
  height: 43px;
  border: 2px solid #38bdf8;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: #38bdf8;
  font-size: 21px;
  box-shadow: 0 0 15px #087da866;
}

header h2 {
  margin: 0;
  letter-spacing: 4px;
}

header small {
  color: #38bdf8;
  font-size: 10px;
  letter-spacing: 2px;
}

.status {
  margin-left: auto;
  color: #4ade80;
  font-size: 11px;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 25px 17px 110px;
}

.welcome {
  text-align: center;
  margin: 65px 0 35px;
}

.core {
  width: 105px;
  height: 105px;
  margin: auto;
  border: 2px solid #38bdf8;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 43px;
  color: #38bdf8;
  box-shadow: 0 0 35px #0284c766,
              inset 0 0 25px #0284c733;
}

.welcome h1 {
  letter-spacing: 7px;
  margin-bottom: 8px;
}

.welcome p {
  color: #8198b1;
  font-size: 13px;
}

#chat {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.message {
  padding: 14px 16px;
  border-radius: 14px;
  max-width: 85%;
  line-height: 1.6;
  font-size: 14px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.bot {
  align-self: flex-start;
  background: #12243a;
  border: 1px solid #1c4668;
}

.user {
  align-self: flex-end;
  background: #075985;
}

.sender {
  color: #38bdf8;
  font-size: 10px;
  margin-bottom: 6px;
  letter-spacing: 1px;
}

.composer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #080d16;
  padding: 15px;
  border-top: 1px solid #1b3550;
}

.input-area {
  max-width: 700px;
  margin: auto;
  display: flex;
  gap: 9px;
}

input {
  flex: 1;
  min-width: 0;
  background: #111e2e;
  color: white;
  border: 1px solid #244562;
  border-radius: 12px;
  padding: 15px;
  outline: none;
}

button {
  background: #0284c7;
  border: none;
  border-radius: 12px;
  padding: 0 19px;
  color: white;
  font-size: 17px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: wait;
}

footer {
  text-align: center;
  color: #52677e;
  font-size: 10px;
  margin-top: 25px;
}
</style>
</head>

<body>

<header>
  <div class="logo">C</div>
  <div>
    <h2>CARL</h2>
    <small>PERSONAL AI ASSISTANT</small>
  </div>
  <div class="status">● ONLINE</div>
</header>

<main>
  <section class="welcome" id="welcome">
    <div class="core">✧</div>
    <h1>HELLO, HUMAN.</h1>
    <p>CARL interface initialized.</p>
    <p>Personal AI system — Version 0.3</p>
  </section>

  <section id="chat">
    <div class="message bot">
      <div class="sender">CARL</div>
      Halo! Saya CARL, asisten pribadi Angga.
      Senang bisa kembali berbicara denganmu.
    </div>
  </section>

  <footer>CARL PROJECT © 2026</footer>
</main>

<div class="composer">
  <div class="input-area">
    <input id="message"
      type="text"
      placeholder="Katakan sesuatu kepada CARL..."
      autocomplete="off">
    <button id="sendButton" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
const API_URL =
  "https://carl-api.ahmadanggaalhabsy-aaa.workers.dev/";

const input = document.getElementById("message");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");
const sendButton = document.getElementById("sendButton");

let conversationHistory = [];

function addMessage(senderName, text, type) {
  const box = document.createElement("div");
  box.className = "message " + type;

  const sender = document.createElement("div");
  sender.className = "sender";
  sender.textContent = senderName;

  const content = document.createElement("div");
  content.textContent = text;

  box.appendChild(sender);
  box.appendChild(content);
  chat.appendChild(box);

  return content;
}

async function sendMessage() {
  const text = input.value.trim();

  if (!text || sendButton.disabled) return;

  welcome.style.display = "none";

  addMessage("ANGGA", text, "user");

  const reply = addMessage(
    "CARL",
    "Sedang memproses...",
    "bot"
  );

  input.value = "";
  sendButton.disabled = true;

  const pendingHistory = [
    ...conversationHistory,
    {
      role: "user",
      content: text
    }
  ].slice(-12);

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain"
      },
      body: JSON.stringify({
        messages: pendingHistory
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.details || data.error || "Koneksi gagal"
      );
    }

    const answer = data.reply || "CARL menerima pesan.";

    reply.textContent = answer;

    conversationHistory = [
      ...pendingHistory,
      {
        role: "assistant",
        content: answer
      }
    ].slice(-12);

  } catch (error) {
    reply.textContent = "Terjadi kesalahan: " + error.message;
  }

  sendButton.disabled = false;
  input.focus();

  window.scrollTo(0, document.body.scrollHeight);
}

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    sendMessage();
  }
});
</script>

</body>
</html>
